# Local operation; no paid provider fallback or automatic top-up is enabled.
llm:
  provider: codex_subscription
  daily_cap: 100
  timeout_sec: 180
  cooldown_minutes: 30
filter:
  daily_score_limit: 30  # Leave model-call capacity for document preparation.
  apply_threshold: 7
  thin_apply_threshold: 9
  thin_description_chars: 100
  gap_log_min: 5
  # Historical/role sponsorship evidence orders equal-fit jobs; never raises fit.
  boost_mode: priority
  sponsor_boost: {strong: 1.0, some: 0.5, weak: 0.25}
  sponsor_tiers: {strong: 50, some: 10, weak: 1}
  jd_positive_boost: 2.0
  max_age_days: 30
discover:
  boards: [greenhouse, lever, ashby, workday]
  scraper_sites: [indeed, glassdoor, zip_recruiter]
  results_per_query: 40
  hours_old: 168
tailor:
  include_summary: false
  max_projects: 5
  cover_letter_max_words: 250
apply:
  backend: playwright
  dry_runs_required: 20
  max_applies_per_day: 10
  reviewed_trials_required: 3
  browser_timeout_ms: 20000
tracking:
  gmail_enabled: false
learn:
  weekly_learning_hours: 4
